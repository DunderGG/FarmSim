; Project Vestige's changes to the engine's scalability levels (Engine/Config/BaseScalability.ini).
; The target PC holds the frame budget at High; expensive features are Epic-only options (Docs/Architecture.md, section 10).

; Hardware ray tracing for Lumen only at Epic and Cinematic. Below that, Lumen uses software ray tracing.
; r.RayTracing stays on in DefaultEngine.ini so Epic can use it. Don't set r.Lumen.HardwareRayTracing in Project Settings:
; a project setting outranks these lines and would turn it on or off at every level.
[GlobalIlluminationQuality@0]
r.Lumen.HardwareRayTracing=0

[GlobalIlluminationQuality@1]
r.Lumen.HardwareRayTracing=0

[GlobalIlluminationQuality@2]
r.Lumen.HardwareRayTracing=0

[GlobalIlluminationQuality@3]
r.Lumen.HardwareRayTracing=1

[GlobalIlluminationQuality@Cine]
r.Lumen.HardwareRayTracing=1
